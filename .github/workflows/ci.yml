name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatierung
        run: npm run format:check
      - name: Typprüfung (TypeScript, strict)
        run: npm run typecheck
      - name: Unit-Tests (Medizin-Logik)
        run: npm test
      - name: Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Browser-Tests (Mobil + Desktop)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
