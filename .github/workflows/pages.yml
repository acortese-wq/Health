name: Deploy auf GitHub Pages

# Nur manuell: Die Seite wird derzeit über «Deploy from branch» veröffentlicht
# (App unter /Health/app/, persönliche Dateien per _config.yml ausgeschlossen).
# Wer auf Settings → Pages → Source «GitHub Actions» umstellt, aktiviert hier wieder
# den push-Auslöser; die App liegt dann direkt unter /Health/.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
